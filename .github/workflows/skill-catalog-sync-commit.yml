name: Skill catalog sync commit

concurrency:
  group: skill-catalog-sync-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - feat/all-skills-consolidated-2026
      - feat/nexora-climate-lattice-reuse-2026-10-30
      - feat/nexora-voxel-memory-benchmark-refresh-2551-2026-10-31
      - feat/nexora-hotbar-slot-identity-2552-2026-10-31
      - feat/nexora-biome-climate-weight-blending-2026-10-30
      - feat/nexora-rhi-surface-recovery-2538-2026-10-30
      - feat/nexora-job-system-long-run-health-2538-2026-10-30
      - feat/nexora-job-queue-admission-budget-2539-2026-10-30
      - feat/nexora-surface-acquisition-recovery-2026-10-30
      - feat/nexora-environmental-vfx-bridge-2514-main-2026-10-30
      - feat/nexora-voxel-palette-transition-invariants-2515-clean-2026-10-30
      - feat/nexora-chunk-change-feed-gap-recovery-2516-2026-10-30
      - feat/nexora-durable-edit-journal-replay-2517-2026-10-30
      - feat/nexora-region-residency-preservation-2518-2026-10-30
      - feat/nexora-texture-forge-build-plan-integrity-2519-2026-10-30
      - feat/nexora-edit-remesh-snapshot-refresh-2520-main-2026-10-30
      - feat/nexora-client-retained-column-spill-lifecycle-2521-2026-10-30
      - feat/nexora-tracked-local-artifact-exposure-response-2522-2026-10-30

permissions:
  contents: write

jobs:
  sync-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate bundle and verify idempotence
        shell: bash
        run: |
          set -euo pipefail
          node tools/sync-skill-bundles.mjs --write
          git diff --binary > "$RUNNER_TEMP/first-write.diff"
          node tools/sync-skill-bundles.mjs --write
          git diff --binary > "$RUNNER_TEMP/second-write.diff"
          cmp "$RUNNER_TEMP/first-write.diff" "$RUNNER_TEMP/second-write.diff"
          git diff --check

      - name: Validate current consolidated 2,500-skill structure and source/bundle parity
        if: github.ref_name == 'feat/all-skills-consolidated-2026'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/2500.json

      - name: Validate NEXORA 2,503-skill batch and source/bundle parity
        if: github.ref_name == 'feat/nexora-climate-lattice-reuse-2026-10-30'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/nexora-2503.json

      - name: Validate NEXORA 2,505-skill batch and source/bundle parity
        if: github.ref_name == 'feat/nexora-biome-climate-weight-blending-2026-10-30'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/nexora-2505.json

      - name: Validate NEXORA 2,507-skill batch and source/bundle parity
        if: github.ref_name == 'feat/nexora-surface-acquisition-recovery-2026-10-30'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/nexora-2507.json

      - name: Validate NEXORA 2,537-skill batch and source/bundle parity
        if: github.ref_name == 'feat/nexora-rhi-surface-recovery-2538-2026-10-30'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/nexora-2537.json

      - name: Validate NEXORA 2,538-skill job system batch and source/bundle parity
        if: github.ref_name == 'feat/nexora-job-system-long-run-health-2538-2026-10-30'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/nexora-2538.json

      - name: Validate NEXORA 2,539-skill job queue admission batch and source/bundle parity
        if: github.ref_name == 'feat/nexora-job-queue-admission-budget-2539-2026-10-30'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/nexora-2539.json

      - name: Validate NEXORA 2,552-skill hotbar batch and source/bundle parity
        if: github.ref_name == 'feat/nexora-hotbar-slot-identity-2552-2026-10-31'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/nexora-2552.json

      - name: Commit generated synchronization outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Generated outputs already synchronized; no commit needed."
            exit 0
          fi
          git commit -m "chore: sync generated skill catalogs and bundles"
          git push origin "HEAD:${GITHUB_REF_NAME}"
