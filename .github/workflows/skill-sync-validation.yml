name: Skill sync validation

on:
  push:
    branches:
      - fix/skill-sync-target-2500-2026
      - feat/skills-expansion-525-from-sync-fix-2026
      - feat/skills-expansion-550-from-525-2026
      - feat/skills-expansion-600-from-550-2026
      - feat/skills-expansion-850-from-600-2026
      - feat/skills-expansion-1000-from-850-2026
      - feat/skills-expansion-1150-from-1000-2026
      - feat/skills-expansion-1500-projete-cross-agent-2026
      - feat/skills-expansion-1525-agent-orchestration-2026
      - feat/agent-orchestration-workbench-2026
      - feat/orchestration-workflow-commands-2026
      - feat/rea-inspired-150-agents-25k-skills-2026
      - fix/1540-skill-sync-validation-routing-2026
      - feat/repository-skill-candidate-gate-2026
      - feat/repository-evidence-manifest-2026
      - feat/repository-candidate-assembly-2026
      - feat/repository-review-batches-2026
      - feat/repository-skill-spec-scaffolder-2026
      - feat/repository-skill-spec-validation-2026
      - feat/repository-draft-spec-preflight-2026
      - feat/repository-draft-candidate-handoff-2026
      - feat/repository-draft-candidate-preparation-2026
      - feat/repository-candidate-preassembly-audit-2026
      - feat/all-skills-consolidated-2026
      - fix/2500-catalog-validation-routing-2026-10-30
      - feat/nexora-stream-handle-lifecycle-2026-10-30
      - feat/nexora-climate-lattice-reuse-2026-10-30
      - feat/nexora-biome-climate-weight-blending-2026-10-30
      - feat/nexora-surface-acquisition-recovery-2026-10-30
      - feat/nexora-transparent-pass-order-2026-10-30
      - feat/nexora-cutout-layer-integration-2026-10-30
      - feat/nexora-pbr-material-render-bridge-2026-10-30
      - feat/nexora-lighting-render-extraction-2026-10-30
      - feat/nexora-shadow-caster-extraction-2026-10-30
      - feat/nexora-atmosphere-fog-composition-2026-10-30
      - feat/nexora-environmental-vfx-bridge-2514-main-2026-10-30
      - feat/nexora-voxel-palette-transition-invariants-2515-clean-2026-10-30
      - feat/nexora-durable-edit-journal-replay-2517-2026-10-30
  pull_request:
    branches:
      - main
      - feat/all-skills-consolidated-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI for native plugin validation
        run: npm install --global @anthropic-ai/claude-code

      - name: Validate marketplace and all local plugins in strict mode
        shell: bash
        run: |
          set -euo pipefail
          claude --version
          claude plugin validate --strict .
          for plugin_dir in plugins/*; do
            if [[ -f "$plugin_dir/.claude-plugin/plugin.json" ]]; then
              claude plugin validate --strict "$plugin_dir"
            fi
          done

      - name: Smoke test clean marketplace installation
        shell: bash
        run: |
          set -euo pipefail
          isolated_home="$(mktemp -d)"
          trap 'rm -rf "$isolated_home"' EXIT
          export HOME="$isolated_home"
          export CLAUDE_CONFIG_DIR="$isolated_home/.claude"
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install all-skills-collection@all-skills-for-the-claude-code --scope user

      - name: Check script syntax
        run: |
          node --check tools/sync-skill-bundles.mjs
          node --check tools/validate-repository-skill-candidate.mjs
          node --check tools/inventory-repository.mjs
          node --check tools/build-repository-evidence-manifest.mjs
          node --check tools/assemble-repository-skill-candidate.mjs
          node --check tools/plan-repository-skill-review-batches.mjs
          node --check tools/discover-repository-skill-opportunities.mjs
          node --check tools/scaffold-repository-skill-spec.mjs
          node --check tools/validate-repository-skill-draft-spec.mjs
          node --check tools/preflight-repository-skill-draft-for-candidate.mjs
          node --check tools/validate-repository-draft-candidate-handoff.mjs
          node --check tools/prepare-repository-draft-candidate-spec.mjs
          node --check tools/audit-repository-candidate-preassembly.mjs

      - name: Self-test repository-to-skill candidate gate
        run: node tools/validate-repository-skill-candidate.mjs --self-test

      - name: Self-test offline repository inventory
        run: node tools/inventory-repository.mjs --self-test

      - name: Self-test pinned repository evidence manifest
        run: node tools/build-repository-evidence-manifest.mjs --self-test

      - name: Self-test evidence-backed candidate assembly
        run: node tools/assemble-repository-skill-candidate.mjs --self-test

      - name: Self-test evidence-backed skill review batch planner
        run: node tools/plan-repository-skill-review-batches.mjs --self-test

      - name: Self-test repository skill opportunity discovery
        run: node tools/discover-repository-skill-opportunities.mjs --self-test

      - name: Self-test repository skill draft specification scaffolder
        run: node tools/scaffold-repository-skill-spec.mjs --self-test

      - name: Self-test repository skill draft specification validator
        run: node tools/validate-repository-skill-draft-spec.mjs --self-test

      - name: Self-test draft-to-candidate preflight
        run: node tools/preflight-repository-skill-draft-for-candidate.mjs --self-test

      - name: Self-test evidence-aware draft candidate handoff
        run: node tools/validate-repository-draft-candidate-handoff.mjs --self-test

      - name: Self-test draft candidate assembly preparation
        run: node tools/prepare-repository-draft-candidate-spec.mjs --self-test

      - name: Self-test repository candidate preassembly audit
        run: node tools/audit-repository-candidate-preassembly.mjs --self-test

      - name: Generate bundle and verify idempotence
        shell: bash
        run: |
          set -euo pipefail
          node tools/sync-skill-bundles.mjs --write
          git diff --binary > "$RUNNER_TEMP/first-write.diff"
          node tools/sync-skill-bundles.mjs --write
          git diff --binary > "$RUNNER_TEMP/second-write.diff"
          cmp "$RUNNER_TEMP/first-write.diff" "$RUNNER_TEMP/second-write.diff"
          git diff --check
          node tools/sync-skill-bundles.mjs --check

      - name: Validate historical 1,525 milestone on historical branches
        if: github.ref_name == 'fix/skill-sync-target-2500-2026' || github.ref_name == 'feat/skills-expansion-525-from-sync-fix-2026' || github.ref_name == 'feat/skills-expansion-550-from-525-2026' || github.ref_name == 'feat/skills-expansion-600-from-550-2026' || github.ref_name == 'feat/skills-expansion-850-from-600-2026' || github.ref_name == 'feat/skills-expansion-1000-from-850-2026' || github.ref_name == 'feat/skills-expansion-1150-from-1000-2026' || github.ref_name == 'feat/skills-expansion-1500-projete-cross-agent-2026' || github.ref_name == 'feat/skills-expansion-1525-agent-orchestration-2026' || github.ref_name == 'feat/agent-orchestration-workbench-2026'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/1525.json

      - name: Validate 1,540-skill source and bundle parity
        if: github.ref_name == 'feat/rea-inspired-150-agents-25k-skills-2026' || github.ref_name == 'feat/orchestration-workflow-commands-2026' || github.ref_name == 'fix/1540-skill-sync-validation-routing-2026' || github.ref_name == 'feat/repository-skill-candidate-gate-2026' || github.ref_name == 'feat/repository-evidence-manifest-2026' || github.ref_name == 'feat/repository-candidate-assembly-2026' || github.ref_name == 'feat/repository-review-batches-2026' || github.ref_name == 'feat/repository-skill-spec-scaffolder-2026' || github.ref_name == 'feat/repository-skill-spec-validation-2026' || github.ref_name == 'feat/repository-draft-spec-preflight-2026' || github.ref_name == 'feat/repository-draft-candidate-handoff-2026' || github.ref_name == 'feat/repository-draft-candidate-preparation-2026'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/1540.json

      - name: Validate NEXORA 2,507-skill batch and source/bundle parity
        if: github.ref_name == 'feat/nexora-surface-acquisition-recovery-2026-10-30' || github.head_ref == 'feat/nexora-surface-acquisition-recovery-2026-10-30' || github.ref_name == 'feat/nexora-transparent-pass-order-2026-10-30' || github.head_ref == 'feat/nexora-transparent-pass-order-2026-10-30'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/nexora-2507.json

      - name: Validate NEXORA 2,508-skill batch and source/bundle parity
        if: github.ref_name == 'feat/nexora-cutout-layer-integration-2026-10-30' || github.head_ref == 'feat/nexora-cutout-layer-integration-2026-10-30'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/nexora-2508.json

      - name: Validate NEXORA 2,509-skill batch and source/bundle parity
        if: github.ref_name == 'feat/nexora-pbr-material-render-bridge-2026-10-30' || github.head_ref == 'feat/nexora-pbr-material-render-bridge-2026-10-30'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/nexora-2509.json

      - name: Validate NEXORA 2,510-skill batch and source/bundle parity
        if: github.ref_name == 'feat/nexora-lighting-render-extraction-2026-10-30' || github.head_ref == 'feat/nexora-lighting-render-extraction-2026-10-30'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/nexora-2510.json

      - name: Validate NEXORA 2,511-skill batch and source/bundle parity
        if: github.ref_name == 'feat/nexora-shadow-caster-extraction-2026-10-30' || github.head_ref == 'feat/nexora-shadow-caster-extraction-2026-10-30'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/nexora-2511.json

      - name: Validate NEXORA 2,512-skill batch and source/bundle parity
        if: github.ref_name == 'feat/nexora-atmosphere-fog-composition-2026-10-30' || github.head_ref == 'feat/nexora-atmosphere-fog-composition-2026-10-30'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/nexora-2512.json

      - name: Validate NEXORA 2,514-skill batch and source/bundle parity
        if: github.ref_name == 'feat/nexora-environmental-vfx-bridge-2514-main-2026-10-30' || github.head_ref == 'feat/nexora-environmental-vfx-bridge-2514-main-2026-10-30'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/nexora-2514.json

      - name: Validate NEXORA 2,515-skill batch and source/bundle parity
        if: github.ref_name == 'feat/nexora-voxel-palette-transition-invariants-2515-clean-2026-10-30' || github.head_ref == 'feat/nexora-voxel-palette-transition-invariants-2515-clean-2026-10-30'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/nexora-2515.json

      - name: Validate NEXORA 2,513-skill batch and source/bundle parity
        if: github.ref_name == 'feat/nexora-voxel-memory-workload-benchmark-2026-10-30' || github.head_ref == 'feat/nexora-voxel-memory-workload-benchmark-2026-10-30'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/nexora-2513.json

      - name: Validate NEXORA 2,516-skill batch and source/bundle parity
        if: github.ref_name == 'feat/nexora-chunk-change-feed-gap-recovery-2516-2026-10-30' || github.head_ref == 'feat/nexora-chunk-change-feed-gap-recovery-2516-2026-10-30'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/nexora-2516.json

      - name: Validate NEXORA 2,517-skill batch and source/bundle parity
        if: github.ref_name == 'feat/nexora-durable-edit-journal-replay-2517-2026-10-30' || github.head_ref == 'feat/nexora-durable-edit-journal-replay-2517-2026-10-30'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/nexora-2517.json

      - name: Validate agent orchestration plugin
        run: node tools/validate-agent-plugin.mjs

      - name: Validate artifact analysis workbench
        run: node tools/validate-artifact-analysis-workbench.mjs

      - name: Validate current catalog manifest and source/bundle parity
        if: github.ref_name == 'feat/all-skills-consolidated-2026' || github.head_ref == 'feat/all-skills-consolidated-2026' || github.base_ref == 'feat/all-skills-consolidated-2026' || github.head_ref == 'cleanup/remove-retained-imported-skills-2026-10-30' || github.head_ref == 'fix/2500-catalog-validation-routing-2026-10-30' || github.ref_name == 'fix/2500-catalog-validation-routing-2026-10-30' || github.head_ref == 'feat/nexora-stream-handle-lifecycle-2026-10-30' || github.ref_name == 'feat/nexora-stream-handle-lifecycle-2026-10-30' || github.head_ref == 'feat/nexora-climate-lattice-reuse-2026-10-30' || github.ref_name == 'feat/nexora-climate-lattice-reuse-2026-10-30' || github.head_ref == 'feat/nexora-biome-climate-weight-blending-2026-10-30' || github.ref_name == 'feat/nexora-biome-climate-weight-blending-2026-10-30'
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/nexora-2505.json
