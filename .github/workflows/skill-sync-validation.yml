name: Skill sync validation

on:
  push:
    branches:
      - fix/skill-sync-target-2500-2026
      - feat/skills-expansion-525-from-sync-fix-2026
      - feat/skills-expansion-550-from-525-2026
      - feat/skills-expansion-600-from-550-2026
      - feat/skills-expansion-850-from-600-2026
      - feat/skills-expansion-1000-from-850-2026
      - feat/skills-expansion-1150-from-1000-2026
      - feat/skills-expansion-1500-projete-cross-agent-2026
      - feat/skills-expansion-1750-cross-domain-2026
      - feat/skills-expansion-2000-simulation-worlds-2026
      - feat/all-skills-consolidated-2026
  pull_request:
    branches:
      - main
      - feat/all-skills-consolidated-2026
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check script syntax
        run: node --check tools/sync-skill-bundles.mjs

      - name: Generate bundle and verify idempotence
        shell: bash
        run: |
          set -euo pipefail
          node tools/sync-skill-bundles.mjs --write
          git diff --binary > "$RUNNER_TEMP/first-write.diff"
          node tools/sync-skill-bundles.mjs --write
          git diff --binary > "$RUNNER_TEMP/second-write.diff"
          cmp "$RUNNER_TEMP/first-write.diff" "$RUNNER_TEMP/second-write.diff"
          git diff --check
          node tools/sync-skill-bundles.mjs --check

      - name: Validate current milestone structure and source/bundle parity
        run: node tools/validate-skill-batch.mjs tools/skill-batch-manifests/2085.json

      # Keep generated catalogs and bundle metadata versioned on the feature branch.
      # Pull-request runs validate only; only trusted pushes to the feature branch commit generated outputs.
      - name: Commit generated synchronization outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/all-skills-consolidated-2026'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Generated outputs already synchronized; no commit needed."
            exit 0
          fi
          git commit -m "chore: sync generated skill catalogs and bundles"
          git push origin "HEAD:feat/all-skills-consolidated-2026"
